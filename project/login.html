<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>เข้าสู่ระบบ · บ้านกาญจน์ Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: "IBM Plex Sans Thai", "Sora", system-ui, sans-serif;
    background: #1f1813;
    color: #ebe1cc;
    -webkit-font-smoothing: antialiased;
    display: grid;
    place-items: center;
    min-height: 100vh;
    background-image: radial-gradient(circle at 20% 30%, #2a201a 0%, #1f1813 50%);
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #ffffff;
    color: #2c241b;
    border-radius: 16px;
    padding: 40px 36px;
    box-shadow: 0 20px 60px -20px rgba(0,0,0,0.6);
    margin: 16px;
  }
  .logo {
    width: 56px; height: 56px;
    border-radius: 14px;
    background: linear-gradient(135deg, #c46a3e, #a4542d);
    color: #fff;
    display: grid; place-items: center;
    font-family: 'Sora', sans-serif;
    font-weight: 700;
    font-size: 24px;
    margin-bottom: 20px;
  }
  h1 {
    font-family: 'Sora', sans-serif;
    font-size: 24px;
    font-weight: 600;
    margin: 0 0 6px;
    color: #2c241b;
  }
  .sub {
    font-size: 13.5px;
    color: #8a7d6b;
    margin-bottom: 28px;
  }
  label {
    display: block;
    font-size: 12.5px;
    font-weight: 500;
    color: #5b4f40;
    margin: 16px 0 6px;
  }
  input {
    width: 100%;
    height: 42px;
    padding: 0 14px;
    border: 1px solid #ece4d4;
    border-radius: 9px;
    background: #ffffff;
    color: #2c241b;
    font-family: inherit;
    font-size: 14px;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus {
    outline: none;
    border-color: #c46a3e;
    box-shadow: 0 0 0 3px rgba(196,106,62,0.13);
  }
  button {
    width: 100%;
    height: 44px;
    margin-top: 22px;
    background: #2c241b;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s, transform .08s;
  }
  button:hover:not(:disabled) { background: #1f1813; }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .error {
    margin-top: 14px;
    padding: 10px 12px;
    background: #f9e7e3;
    border: 1px solid #e6c8c2;
    border-radius: 8px;
    color: #5a1a13;
    font-size: 13px;
  }
  .footer {
    margin-top: 22px;
    text-align: center;
    font-size: 12px;
    color: #8a7d6b;
  }
  .footer a {
    color: #c46a3e;
    text-decoration: none;
  }
</style>
</head>
<body>
  <form class="card" id="loginForm">
    <div class="logo">บ</div>
    <h1>เข้าสู่ระบบผู้ดูแล</h1>
    <div class="sub">บ้านกาญจน์ เรสซิเดนซ์ — Admin Console</div>

    <label for="username">ชื่อผู้ใช้</label>
    <input type="text" id="username" name="username" autocomplete="username" required autofocus/>

    <label for="password">รหัสผ่าน</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required/>

    <button type="submit" id="submitBtn">เข้าสู่ระบบ</button>

    <div id="error" class="error" style="display:none"></div>

    <div class="footer">
      ผู้เช่า? <a href="/">ดูสถานะห้อง</a>
    </div>
  </form>

  <script>
    const form = document.getElementById('loginForm');
    const btn = document.getElementById('submitBtn');
    const errBox = document.getElementById('error');

    // If already logged in, skip login
    fetch('/api/auth/me').then(r => r.json()).then(d => {
      if (d.user) window.location.href = '/admin';
    }).catch(() => {});

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'กำลังเข้าสู่ระบบ...';
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();
        if (!res.ok) {
          errBox.textContent = data.error === 'invalid credentials'
            ? 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง'
            : (data.error || 'เข้าสู่ระบบล้มเหลว');
          errBox.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'เข้าสู่ระบบ';
          return;
        }
        window.location.href = '/admin';
      } catch (err) {
        errBox.textContent = 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้';
        errBox.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'เข้าสู่ระบบ';
      }
    });
  </script>
</body>
</html>
