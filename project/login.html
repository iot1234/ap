<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>เข้าสู่ระบบ · บ้านกาญจน์ Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: "IBM Plex Sans Thai", "Sora", system-ui, sans-serif;
    background: #1f1813;
    color: #ebe1cc;
    -webkit-font-smoothing: antialiased;
    display: grid;
    place-items: center;
    min-height: 100vh;
    background-image: radial-gradient(circle at 20% 30%, #2a201a 0%, #1f1813 50%);
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #ffffff;
    color: #2c241b;
    border-radius: 16px;
    padding: 40px 36px;
    box-shadow: 0 20px 60px -20px rgba(0,0,0,0.6);
    margin: 16px;
  }
  .logo {
    width: 56px; height: 56px;
    border-radius: 14px;
    background: linear-gradient(135deg, #c46a3e, #a4542d);
    color: #fff;
    display: grid; place-items: center;
    font-family: 'Sora', sans-serif;
    font-weight: 700;
    font-size: 24px;
    margin-bottom: 20px;
  }
  h1 {
    font-family: 'Sora', sans-serif;
    font-size: 24px;
    font-weight: 600;
    margin: 0 0 6px;
    color: #2c241b;
  }
  .sub {
    font-size: 13.5px;
    color: #8a7d6b;
    margin-bottom: 28px;
  }
  label {
    display: block;
    font-size: 12.5px;
    font-weight: 500;
    color: #5b4f40;
    margin: 16px 0 6px;
  }
  input {
    width: 100%;
    height: 42px;
    padding: 0 14px;
    border: 1px solid #ece4d4;
    border-radius: 9px;
    background: #ffffff;
    color: #2c241b;
    font-family: inherit;
    font-size: 14px;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus {
    outline: none;
    border-color: #c46a3e;
    box-shadow: 0 0 0 3px rgba(196,106,62,0.13);
  }
  button {
    width: 100%;
    height: 44px;
    margin-top: 22px;
    background: #2c241b;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s, transform .08s;
  }
  button:hover:not(:disabled) { background: #1f1813; }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .error {
    margin-top: 14px;
    padding: 10px 12px;
    background: #f9e7e3;
    border: 1px solid #e6c8c2;
    border-radius: 8px;
    color: #5a1a13;
    font-size: 13px;
  }
  .footer {
    margin-top: 22px;
    text-align: center;
    font-size: 12px;
    color: #8a7d6b;
  }
  .footer a {
    color: #c46a3e;
    text-decoration: none;
  }
  /* Password show/hide toggle — eye button overlaid on the input. */
  .pw-wrap { position: relative; }
  .pw-wrap input { padding-right: 42px; }
  .pw-toggle {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    width: 32px; height: 32px;
    margin: 0;
    padding: 0;
    background: transparent;
    border: none;
    border-radius: 6px;
    color: #8a7d6b;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background .15s, color .15s;
  }
  .pw-toggle:hover { background: #faf6ee; color: #2c241b; }
  .pw-toggle:focus { outline: 2px solid #c46a3e; outline-offset: 1px; }
  /* CapsLock warning — shown by JS when keydown fires with capsLock state */
  .caps-hint {
    margin-top: 6px;
    font-size: 11.5px;
    color: #a4542d;
    font-weight: 500;
  }
</style>
</head>
<body>
  <form class="card" id="loginForm">
    <div class="logo">บ</div>
    <h1>เข้าสู่ระบบผู้ดูแล</h1>
    <div class="sub">บ้านกาญจน์ เรสซิเดนซ์ — Admin Console</div>

    <label for="username">ชื่อผู้ใช้</label>
    <input type="text" id="username" name="username" autocomplete="username" required autofocus/>

    <label for="password">รหัสผ่าน</label>
    <div class="pw-wrap">
      <input type="password" id="password" name="password" autocomplete="current-password" required/>
      <button type="button" id="pwToggle" class="pw-toggle"
              aria-label="แสดง/ซ่อนรหัสผ่าน" aria-pressed="false"
              tabindex="-1">
        <span aria-hidden="true">👁</span>
      </button>
    </div>
    <div id="capsLockHint" class="caps-hint" style="display:none">
      ⚠ Caps Lock เปิดอยู่
    </div>

    <button type="submit" id="submitBtn">เข้าสู่ระบบ</button>

    <div id="error" class="error" style="display:none"></div>

    <div class="footer">
      ผู้เช่า? <a href="/">ดูสถานะห้อง</a>
    </div>
  </form>

  <script>
    const form = document.getElementById('loginForm');
    const btn = document.getElementById('submitBtn');
    const errBox = document.getElementById('error');
    const pwInput = document.getElementById('password');
    const pwToggle = document.getElementById('pwToggle');
    const capsHint = document.getElementById('capsLockHint');
    const usernameInput = document.getElementById('username');

    // If already logged in, skip login. Only redirect on a real 200 with a
    // user payload — a 5xx error response containing {user:null} happens when
    // the session store is down, and we shouldn't loop in that case.
    fetch('/api/auth/me', { credentials: 'include' })
      .then(async (r) => (r.ok ? r.json() : null))
      .then((d) => { if (d && d.user) window.location.href = '/admin'; })
      .catch(() => {});

    // --- Password show/hide --------------------------------------------------
    // Toggling type=text is a recognized accessibility pattern (NN/g, MDN).
    // Form auto-submit risk is mitigated by tabindex=-1 on the toggle so it
    // doesn't capture focus during keyboard nav.
    pwToggle.addEventListener('click', () => {
      const showing = pwInput.type === 'text';
      pwInput.type = showing ? 'password' : 'text';
      pwToggle.setAttribute('aria-pressed', String(!showing));
      pwToggle.querySelector('span').textContent = showing ? '👁' : '🙈';
      // Keep focus on the input so the user can keep typing without
      // re-clicking — a lost focus mid-password-entry is a common irritation.
      pwInput.focus();
    });

    // --- CapsLock warning ---------------------------------------------------
    // Fires on keydown so the warning shows mid-typing, not only on first key.
    // event.getModifierState() works in all evergreen browsers.
    function updateCaps(ev) {
      const on = ev.getModifierState && ev.getModifierState('CapsLock');
      capsHint.style.display = on ? 'block' : 'none';
    }
    pwInput.addEventListener('keydown', updateCaps);
    pwInput.addEventListener('keyup', updateCaps);
    pwInput.addEventListener('blur', () => { capsHint.style.display = 'none'; });

    // Remember the LAST USED USERNAME (never password) so returning admins
    // can hit Enter twice. localStorage so it survives browser restart;
    // common pattern, low risk since it's identifying info not credentials.
    const LAST_USER_KEY = '__admin_last_username';
    try {
      const last = localStorage.getItem(LAST_USER_KEY);
      if (last && !usernameInput.value) {
        usernameInput.value = last;
        // Move autofocus to the password field since username is pre-filled.
        usernameInput.removeAttribute('autofocus');
        pwInput.setAttribute('autofocus', '');
        // Manual focus call too — autofocus attribute only fires on initial render.
        setTimeout(() => pwInput.focus(), 0);
      }
    } catch { /* private mode — ignore */ }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'กำลังเข้าสู่ระบบ...';
      const username = usernameInput.value.trim();
      const password = pwInput.value;
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 8000);
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ username, password }),
          signal: ctrl.signal,
        });
        const data = await res.json().catch(() => ({}));
        if (res.status === 429) {
          // Rate-limit response. Server sets Retry-After header; surface that
          // value so admins know exactly how long to wait instead of just
          // "ลองใหม่อีกครั้ง" with no timeline.
          const retryAfter = Number(res.headers.get('Retry-After'));
          let waitMsg = 'อีก 15 นาที'; // matches loginLimiter windowMs in server.js
          if (Number.isFinite(retryAfter) && retryAfter > 0) {
            const mins = Math.ceil(retryAfter / 60);
            waitMsg = mins >= 1 ? `อีก ${mins} นาที` : `อีก ${retryAfter} วินาที`;
          } else if (data && data.code === 'LOCKED_OUT' && /\d+\s*นาที/.test(String(data.error || ''))) {
            // LockedOut — server's Thai message already says "ลองใหม่ใน N นาที"
            errBox.textContent = data.error;
            errBox.style.display = 'block';
            btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ';
            return;
          }
          errBox.textContent = `พยายามเข้าระบบบ่อยเกินไป — ลองใหม่ ${waitMsg}`;
          errBox.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'เข้าสู่ระบบ';
          return;
        }
        if (!res.ok) {
          errBox.textContent = data.error === 'invalid credentials'
            ? 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง'
            : (data.error || 'เข้าสู่ระบบล้มเหลว');
          errBox.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'เข้าสู่ระบบ';
          return;
        }
        // Save username only AFTER a successful login (don't burn-in a typo).
        try { localStorage.setItem(LAST_USER_KEY, username); } catch { /* ignore */ }
        window.location.href = '/admin';
      } catch (err) {
        errBox.textContent = err && err.name === 'AbortError'
          ? 'เชื่อมต่อช้าเกินไป กรุณาลองใหม่'
          : 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้';
        errBox.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'เข้าสู่ระบบ';
      } finally {
        clearTimeout(timer);
      }
    });
  </script>
</body>
</html>
