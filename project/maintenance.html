<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>แจ้งซ่อม · บ้านกาญจน์ เรสซิเดนซ์</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    font-family: "IBM Plex Sans Thai", "Sora", system-ui, sans-serif;
    background: #f5efe3;
    color: #2c241b;
    -webkit-font-smoothing: antialiased;
    line-height: 1.55;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 32px 20px 80px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; }
  .brand { display: flex; align-items: center; gap: 12px; font-family: 'Sora', sans-serif; font-weight: 600; font-size: 18px; }
  .brand-logo {
    width: 40px; height: 40px; border-radius: 11px;
    background: linear-gradient(135deg, #c46a3e, #a4542d);
    color: #fff; display: grid; place-items: center;
    font-weight: 700; font-size: 20px;
  }
  .topbar a {
    color: #5b4f40; text-decoration: none; font-size: 13.5px;
    padding: 8px 14px; border-radius: 8px; background: #fff;
    border: 1px solid #ece4d4; transition: background .15s;
  }
  .topbar a:hover { background: #faf6ee; }
  h1 { font-family: 'Sora', sans-serif; font-size: 28px; font-weight: 600; margin: 0 0 8px; }
  .lead { font-size: 14.5px; color: #5b4f40; margin-bottom: 24px; }
  .tabs {
    display: flex; gap: 4px; padding: 4px; margin-bottom: 16px;
    background: #faf6ee; border: 1px solid #ece4d4; border-radius: 10px;
  }
  .tab {
    flex: 1; padding: 10px; border: none; background: transparent;
    font-family: inherit; font-size: 13.5px; font-weight: 500;
    color: #5b4f40; cursor: pointer; border-radius: 7px;
    transition: background .15s, color .15s;
  }
  .tab.active { background: #fff; color: #c46a3e; box-shadow: 0 1px 0 rgba(0,0,0,0.04); }
  .card { background: #fff; border: 1px solid #ece4d4; border-radius: 14px; padding: 28px; }
  .row { display: grid; gap: 16px; margin-bottom: 16px; }
  .row.cols-2 { grid-template-columns: 1fr 1fr; }
  @media (max-width: 600px) { .row.cols-2 { grid-template-columns: 1fr; } }
  label { display: block; font-size: 12.5px; font-weight: 500; color: #5b4f40; margin-bottom: 6px; }
  .req::after { content: " *"; color: #b54639; }
  input, select, textarea {
    width: 100%; height: 40px; padding: 0 12px;
    background: #fff; color: #2c241b;
    border: 1px solid #ece4d4; border-radius: 9px;
    font-family: inherit; font-size: 13.5px;
  }
  textarea { height: auto; padding: 10px 12px; min-height: 100px; resize: vertical; }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: #c46a3e; box-shadow: 0 0 0 3px rgba(196,106,62,0.13);
  }
  button[type=submit] {
    width: 100%; height: 46px; margin-top: 12px;
    background: #2c241b; color: #fff; border: none; border-radius: 10px;
    font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
    transition: background .15s;
  }
  button[type=submit]:hover:not(:disabled) { background: #1f1813; }
  button[type=submit]:disabled { opacity: 0.5; cursor: not-allowed; }
  .alert { padding: 12px 14px; border-radius: 9px; font-size: 13.5px; margin-top: 16px; }
  .alert-error { background: #f9e7e3; border: 1px solid #e6c8c2; color: #5a1a13; }
  .ticket {
    background: #fff; border: 1px solid #ece4d4; border-radius: 10px;
    padding: 14px 16px; margin-bottom: 8px;
  }
  .ticket-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .ticket-no { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #8a7d6b; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .pill-open { background: #f9e7e3; color: #5a1a13; }
  .pill-assigned { background: #fbf1de; color: #5a3a0d; }
  .pill-in_progress { background: #e3edf5; color: #1c3850; }
  .pill-awaiting_parts { background: #efe6f3; color: #3a1d44; }
  .pill-completed { background: #e6f4ec; color: #0e3a25; }
  .pill-cancelled { background: #f3ece0; color: #5b4f40; }
  .ticket-title { font-size: 14px; color: #2c241b; font-weight: 500; margin-top: 6px; }
  .ticket-meta { font-size: 12px; color: #8a7d6b; margin-top: 4px; }
  .rate-block { margin-top: 10px; padding-top: 10px; border-top: 1px solid #ece4d4; }
  .rate-prompt { font-size: 12px; color: #5b4f40; margin-bottom: 6px; }
  .rate-stars { display: flex; gap: 4px; }
  .rate-star {
    background: transparent; border: 1px solid #ece4d4; border-radius: 7px;
    width: 36px; height: 36px; font-size: 16px; cursor: pointer;
    color: #d9cdb5; transition: color .15s, border-color .15s;
  }
  .rate-star:hover:not(:disabled) { color: #c98a2b; border-color: #c98a2b; }
  .rate-star:disabled { opacity: 0.5; cursor: not-allowed; }
  .success-card { background: #fff; border: 1px solid #ece4d4; border-radius: 14px; padding: 36px 28px; text-align: center; }
  .success-icon {
    width: 64px; height: 64px; border-radius: 50%; background: #e6f4ec; color: #2e9b6a;
    display: grid; place-items: center; font-size: 32px; margin: 0 auto 18px;
  }
  .success-card h2 { font-family: 'Sora', sans-serif; font-size: 22px; font-weight: 600; margin: 0 0 8px; }
  .success-card p { color: #5b4f40; font-size: 14px; margin: 0 0 8px; }
  .ref { font-family: 'JetBrains Mono', monospace; color: #c46a3e; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <div class="brand-logo">บ</div>
      <span>บ้านกาญจน์ เรสซิเดนซ์</span>
    </div>
    <a href="/">← กลับหน้าแรก</a>
  </div>

  <h1>แจ้งซ่อม</h1>
  <p class="lead">แจ้งปัญหาภายในห้องพัก เจ้าหน้าที่จะติดต่อกลับโดยเร็ว</p>

  <div class="tabs">
    <button id="tabSubmit" class="tab active">แจ้งใหม่</button>
    <button id="tabHistory" class="tab">ประวัติของฉัน</button>
  </div>

  <div id="formContainer">
    <form id="ticketForm" class="card" novalidate>
      <div class="row cols-2">
        <div>
          <label for="roomId" class="req">เลขห้อง</label>
          <input type="text" id="roomId" name="roomId" required maxlength="16" placeholder="เช่น 201"/>
        </div>
        <div>
          <label for="tenantPhone" class="req">เบอร์ติดต่อ</label>
          <input type="tel" id="tenantPhone" name="tenantPhone" required maxlength="20" placeholder="08X-XXX-XXXX"/>
        </div>
      </div>

      <div class="row cols-2">
        <div>
          <label for="tenantName">ชื่อ-นามสกุล</label>
          <input type="text" id="tenantName" name="tenantName" maxlength="120"/>
        </div>
        <div>
          <label for="category" class="req">หมวด</label>
          <select id="category" name="category" required>
            <option value="">-- เลือก --</option>
            <option value="electrical">⚡ ระบบไฟฟ้า</option>
            <option value="plumbing">🚰 ระบบประปา</option>
            <option value="aircon">❄️ เครื่องปรับอากาศ</option>
            <option value="furniture">🪑 เฟอร์นิเจอร์</option>
            <option value="appliance">🔌 เครื่องใช้ไฟฟ้า</option>
            <option value="door_lock">🚪 ประตู/ล็อก</option>
            <option value="wifi">📶 Wi-Fi/อินเทอร์เน็ต</option>
            <option value="other">🛠 อื่นๆ</option>
          </select>
        </div>
      </div>

      <div class="row cols-2">
        <div>
          <label for="priority">ความสำคัญ</label>
          <select id="priority" name="priority">
            <option value="medium">กลาง (ปกติ)</option>
            <option value="critical">วิกฤต (ใช้งานไม่ได้)</option>
            <option value="high">สูง (กระทบการใช้งาน)</option>
            <option value="low">ต่ำ (ปรับปรุง)</option>
          </select>
        </div>
        <div>
          <label for="title" class="req">หัวข้อสั้นๆ</label>
          <input type="text" id="title" name="title" required maxlength="200" placeholder="เช่น แอร์ไม่เย็น"/>
        </div>
      </div>

      <div class="row">
        <div>
          <label for="description">อธิบายปัญหาเพิ่มเติม</label>
          <textarea id="description" name="description" maxlength="2000" placeholder="เช่น แอร์เปิดแล้วลมไม่เย็นมาประมาณ 2 วัน..."></textarea>
        </div>
      </div>

      <button type="submit" id="submitBtn">ส่งคำขอแจ้งซ่อม</button>
      <div id="alert" class="alert alert-error" style="display:none"></div>
    </form>
  </div>

  <div id="historyContainer" style="display:none">
    <div class="card" style="margin-bottom: 16px">
      <div class="row cols-2" style="margin-bottom: 0">
        <div>
          <label for="hRoomId">เลขห้อง</label>
          <input type="text" id="hRoomId" maxlength="16"/>
        </div>
        <div>
          <label for="hPhone">เบอร์ติดต่อ</label>
          <input type="tel" id="hPhone" maxlength="20"/>
        </div>
      </div>
      <button type="button" id="lookupBtn" style="margin-top: 16px;
        width: 100%; height: 44px; background: #c46a3e; color: #fff;
        border: none; border-radius: 10px; font-family: inherit;
        font-size: 14px; font-weight: 500; cursor: pointer;">ค้นหา</button>
    </div>
    <div id="ticketList"></div>
  </div>

  <template id="successTpl">
    <div class="success-card">
      <div class="success-icon">✓</div>
      <h2>ได้รับคำขอแจ้งซ่อมแล้ว</h2>
      <p>เจ้าหน้าที่จะติดต่อกลับโดยเร็วที่สุด</p>
      <p>หมายเลขอ้างอิง: <span class="ref" id="refNo"></span></p>
      <p style="margin-top:24px"><a href="/" style="color:#c46a3e;text-decoration:none;font-weight:500">← กลับหน้าแรก</a></p>
    </div>
  </template>
</div>

<script>
(function() {
  const form = document.getElementById('ticketForm');
  const btn = document.getElementById('submitBtn');
  const alert = document.getElementById('alert');
  const formContainer = document.getElementById('formContainer');
  const historyContainer = document.getElementById('historyContainer');
  const tabSubmit = document.getElementById('tabSubmit');
  const tabHistory = document.getElementById('tabHistory');
  const ticketList = document.getElementById('ticketList');

  function showError(msg) {
    alert.textContent = msg;
    alert.style.display = 'block';
  }

  tabSubmit.onclick = () => {
    tabSubmit.classList.add('active'); tabHistory.classList.remove('active');
    formContainer.style.display = ''; historyContainer.style.display = 'none';
  };
  tabHistory.onclick = () => {
    tabHistory.classList.add('active'); tabSubmit.classList.remove('active');
    formContainer.style.display = 'none'; historyContainer.style.display = '';
  };

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    alert.style.display = 'none';
    const data = {
      roomId: document.getElementById('roomId').value.trim(),
      tenantPhone: document.getElementById('tenantPhone').value.trim(),
      tenantName: document.getElementById('tenantName').value.trim(),
      category: document.getElementById('category').value,
      priority: document.getElementById('priority').value,
      title: document.getElementById('title').value.trim(),
      description: document.getElementById('description').value.trim(),
    };
    if (!data.roomId || !data.tenantPhone || !data.category || !data.title) {
      showError('กรุณากรอกข้อมูลที่จำเป็นให้ครบถ้วน');
      return;
    }
    btn.disabled = true;
    btn.textContent = 'กำลังส่ง...';
    try {
      const res = await fetch('/api/maintenance', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      const result = await res.json();
      if (res.status === 429) {
        showError('คำขอมากเกินไป กรุณาลองใหม่ใน 1 นาที');
        btn.disabled = false; btn.textContent = 'ส่งคำขอแจ้งซ่อม'; return;
      }
      if (!res.ok || !result.ok) {
        showError(result.error || 'ส่งคำขอไม่สำเร็จ');
        btn.disabled = false; btn.textContent = 'ส่งคำขอแจ้งซ่อม'; return;
      }
      const tpl = document.getElementById('successTpl');
      formContainer.innerHTML = '';
      formContainer.appendChild(tpl.content.cloneNode(true));
      document.getElementById('refNo').textContent = result.ticket.ticket_no;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (err) {
      showError('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้');
      btn.disabled = false; btn.textContent = 'ส่งคำขอแจ้งซ่อม';
    }
  });

  document.getElementById('lookupBtn').addEventListener('click', async () => {
    const roomId = document.getElementById('hRoomId').value.trim();
    const phone = document.getElementById('hPhone').value.trim();
    if (!roomId || !phone) {
      ticketList.innerHTML = '<div style="text-align:center;color:#8a7d6b;padding:24px">กรุณากรอกห้องและเบอร์</div>';
      return;
    }
    ticketList.innerHTML = '<div style="text-align:center;color:#8a7d6b;padding:24px">กำลังค้นหา...</div>';
    try {
      const res = await fetch(`/api/maintenance/lookup?roomId=${encodeURIComponent(roomId)}&phone=${encodeURIComponent(phone)}`);
      const data = await res.json();
      if (!data.ok) {
        ticketList.innerHTML = `<div style="text-align:center;color:#5a1a13;padding:24px">${data.error || 'ค้นหาไม่สำเร็จ'}</div>`;
        return;
      }
      if (!data.tickets.length) {
        ticketList.innerHTML = '<div style="text-align:center;color:#8a7d6b;padding:24px">ไม่พบรายการแจ้งซ่อมของคุณ</div>';
        return;
      }
      const STATUS_LABEL = {
        open: 'เปิดใหม่', assigned: 'มอบหมายแล้ว', in_progress: 'กำลังดำเนินการ',
        awaiting_parts: 'รออะไหล่', completed: 'เสร็จสิ้น', cancelled: 'ยกเลิก',
      };
      ticketList.innerHTML = data.tickets.map(t => {
        const isCompletedNoRating = t.status === 'completed' && !t.rating;
        const rateBlock = isCompletedNoRating
          ? `<div class="rate-block" data-tid="${t.id}">
               <div class="rate-prompt">ให้คะแนนการบริการ:</div>
               <div class="rate-stars">
                 ${[1,2,3,4,5].map(n => `<button type="button" class="rate-star" data-tid="${t.id}" data-n="${n}" aria-label="${n} ดาว">★</button>`).join('')}
               </div>
             </div>`
          : '';
        return `
          <div class="ticket">
            <div class="ticket-header">
              <span class="ticket-no">${t.ticket_no}</span>
              <span class="pill pill-${t.status}">${STATUS_LABEL[t.status] || t.status}</span>
            </div>
            <div class="ticket-title">${escapeHtml(t.title)}</div>
            <div class="ticket-meta">
              ห้อง ${escapeHtml(t.room_id)} · แจ้งเมื่อ ${new Date(t.created_at).toLocaleDateString('th-TH')}
              ${t.completed_at ? ` · เสร็จเมื่อ ${new Date(t.completed_at).toLocaleDateString('th-TH')}` : ''}
              ${t.rating ? ` · ${'★'.repeat(t.rating)}${'☆'.repeat(5-t.rating)}` : ''}
            </div>
            ${rateBlock}
          </div>
        `;
      }).join('');

      // Wire up the per-card rating buttons after DOM update.
      const phoneNow = document.getElementById('hPhone').value.trim();
      ticketList.querySelectorAll('.rate-star').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const tid = Number(btn.dataset.tid);
          const rating = Number(btn.dataset.n);
          btn.parentElement.querySelectorAll('.rate-star').forEach(b => b.disabled = true);
          try {
            const res = await fetch(`/api/maintenance/${tid}/rate`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ phone: phoneNow, rating }),
            });
            const out = await res.json();
            if (!res.ok || !out.ok) {
              alert(out.error || 'บันทึกคะแนนไม่สำเร็จ');
              btn.parentElement.querySelectorAll('.rate-star').forEach(b => b.disabled = false);
              return;
            }
            // Re-trigger lookup to refresh UI
            document.getElementById('lookupBtn').click();
          } catch (err) {
            alert('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้');
            btn.parentElement.querySelectorAll('.rate-star').forEach(b => b.disabled = false);
          }
        });
      });
    } catch (err) {
      ticketList.innerHTML = '<div style="text-align:center;color:#5a1a13;padding:24px">เชื่อมต่อเซิร์ฟเวอร์ไม่ได้</div>';
    }
  });

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
})();
</script>
</body>
</html>
