<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg:         #f6f1e7;
    --bg-2:       #efe8d8;
    --surface:    #ffffff;
    --surface-2:  #fbf7ee;
    --ink:        #221b13;
    --ink-2:      #4a3e2f;
    --muted:      #8a7d6a;
    --line:       #e7dfcd;
    --line-2:     #d9cfb8;
    --accent:     #c46a3e;
    --accent-2:   #a4542d;
    --accent-soft:#fbeadc;
    --green:      #2f8f5b;
    --green-soft: #e3f1e8;
    --red:        #b94a48;
    --red-soft:   #f8e0dc;
    --amber:      #b9852a;
    --amber-soft: #f6ead0;
    --blue:       #3a6fae;
    --blue-soft:  #e1ecf7;

    --r-sm: 10px;
    --r:    14px;
    --r-lg: 18px;
    --r-xl: 22px;

    --shadow-sm: 0 1px 2px rgba(40,28,12,0.04), 0 1px 1px rgba(40,28,12,0.03);
    --shadow:    0 6px 18px -10px rgba(40,28,12,0.18), 0 1px 2px rgba(40,28,12,0.04);
    --shadow-lg: 0 30px 60px -30px rgba(40,28,12,0.30), 0 8px 24px -16px rgba(40,28,12,0.14);

    --font-sans:    "IBM Plex Sans Thai","Sora",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    --font-display: "Sora","IBM Plex Sans Thai",system-ui,sans-serif;
    --font-mono:    "JetBrains Mono",ui-monospace,Menlo,monospace;

    /* Spacing scale — one source of truth, no more 14/18/22 mixed in. */
    --sp-1: 4px;
    --sp-2: 8px;
    --sp-3: 12px;
    --sp-4: 16px;
    --sp-5: 20px;
    --sp-6: 24px;
    --sp-7: 32px;
    --sp-8: 40px;

    /* Fluid type scale — clamp(min, fluid, max) so sizes ease between
       360px-wide phones and 1440px-wide desktops instead of snapping
       at breakpoints. Min = readable on a small phone; max = comfortable
       on a 4K display. The fluid term uses vw + a constant so the curve
       is gentle and identical across the scale. */
    --fs-xs:   clamp(11px,  0.20vw + 10.5px, 12px);   /* meta / footnote */
    --fs-sm:   clamp(12px,  0.25vw + 11.5px, 13.5px); /* table headers, hints */
    --fs-base: clamp(13px,  0.35vw + 12px,   15px);   /* body */
    --fs-md:   clamp(14px,  0.45vw + 13px,   16px);   /* card titles */
    --fs-lg:   clamp(15px,  0.55vw + 13.5px, 18px);   /* card subtitles */
    --fs-xl:   clamp(17px,  0.80vw + 15px,   22px);   /* section heading */
    --fs-2xl:  clamp(22px,  1.50vw + 17px,   30px);   /* page title */
    --fs-3xl:  clamp(28px,  3.50vw + 18px,   44px);   /* hero amount */
    --fs-stat: clamp(22px,  1.80vw + 16px,   28px);   /* big stat numbers */

    /* Layout — single set of canonical container widths. */
    --max-content: 1180px;

    /* Heights of fixed shell elements (used in spacing math). */
    --topbar-h:    64px;
    --bottomnav-h: 64px;
    --sidebar-w:   264px;
  }
  [data-theme="dark"] {
    --bg:         #18130d;
    --bg-2:       #1f1810;
    --surface:    #221b12;
    --surface-2:  #28200f;
    --ink:        #f4ecd9;
    --ink-2:      #d4c6a8;
    --muted:      #8a7c63;
    --line:       #2e2618;
    --line-2:     #3a3022;
    --accent-soft:#3a2615;
    --green-soft: #1a2a20;
    --red-soft:   #2d1c1a;
    --amber-soft: #2f2614;
    --blue-soft:  #1c2630;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
    --shadow:    0 6px 18px -10px rgba(0,0,0,0.6), 0 1px 2px rgba(0,0,0,0.4);
    --shadow-lg: 0 30px 60px -30px rgba(0,0,0,0.8), 0 8px 24px -16px rgba(0,0,0,0.5);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100vh;
  }
  button { font-family: inherit; }
  input, select, textarea { font-family: inherit; }
  a { color: inherit; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { scrollbar-width: none; }
  @keyframes slide-up { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes fade-in  { from { opacity: 0; } to { opacity: 1; } }
  .anim-in { animation: slide-up .26s ease both; }
  .ph-stripe {
    background-image: repeating-linear-gradient(135deg,
      var(--surface-2) 0 8px, transparent 8px 16px);
    background-color: var(--surface);
  }
</style>
</head>
<body data-theme="light">
