<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Admin Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  /* Design tokens — sourced from the Admin Console redesign brief.
     5 category colors map to admin sections (overview/rooms/finance/
     service/system). All share same lightness so the system feels
     unified; each category gets one distinct hue. */
  :root {
    --bg:           #F5F6FA;
    --surface:      #FFFFFF;
    --surface-2:    #F9FAFC;
    --surface-3:    #F0F2F7;
    --ink:          #0B1220;
    --ink-2:        #2A3142;
    --muted:        #6B7280;
    --muted-2:      #9AA0AC;
    --border:       #E5E8EF;
    --border-soft:  #EFF1F6;

    --nav-bg:       #0B1220;
    --nav-bg-alt:   #131B2C;
    --nav-border:   rgba(255,255,255,0.07);
    --nav-ink:      #E8EBF0;
    --nav-ink-soft: #B5BCC9;
    --nav-muted:    #6F7787;

    --c-overview:   #475569;   --c-overview-soft:  #EEF1F5;
    --c-rooms:      #2563EB;   --c-rooms-soft:     #E8F0FE;
    --c-finance:    #059669;   --c-finance-soft:   #E3F5EC;
    --c-service:    #D97706;   --c-service-soft:   #FCEFDB;
    --c-system:     #7C3AED;   --c-system-soft:    #EFE7FB;

    --success: #059669; --success-soft: #E3F5EC;
    --warn:    #D97706; --warn-soft:    #FCEFDB;
    --danger:  #DC2626; --danger-soft:  #FCE7E7;
    --info:    #2563EB; --info-soft:    #E8F0FE;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "IBM Plex Sans Thai", "IBM Plex Sans", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb {
    background: rgba(15,22,35,0.12); border-radius: 999px;
    border: 2px solid var(--bg);
  }
  ::-webkit-scrollbar-thumb:hover { background: rgba(15,22,35,0.22); }
  ::-webkit-scrollbar-track { background: transparent; }
  /* Dark sidebar scrollbar */
  aside.sidebar ::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.08); border-color: var(--nav-bg);
  }
  /* Sidebar background radial accents (subtle) */
  aside.sidebar {
    background:
      radial-gradient(800px 400px at -10% -10%, rgba(37,99,235,0.10), transparent 60%),
      radial-gradient(700px 500px at 110% 110%, rgba(124,58,237,0.08), transparent 60%),
      var(--nav-bg) !important;
  }
  button { font-family: inherit; }
  button:hover { filter: brightness(0.98); }
  button:active { transform: translateY(1px); }
  input, textarea, select { font-family: inherit; }
  ::selection { background: rgba(37,99,235,0.18); }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp {
    from { transform: translate(-50%, 100%); opacity: 0; }
    to { transform: translate(-50%, 0); opacity: 1; }
  }
  @keyframes slideRight {
    from { transform: translateX(-100%); }
    to { transform: translateX(0); }
  }
  @keyframes slideLeft {
    from { transform: translateX(100%); }
    to { transform: translateX(0); }
  }
  @keyframes growBar {
    from { transform: scaleY(0); opacity: 0; }
    to { transform: scaleY(1); opacity: 1; }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes skeletonPulse {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  /* ========== Responsive breakpoints ====================================
     Admin Console targets four screen classes:
       - desktop  ≥ 1280px : full sidebar + multi-column content
       - laptop   ≥  900px : full sidebar + slightly tighter padding
       - tablet   ≥  640px : sidebar collapses to icon-rail by default
       - mobile   <  640px : sidebar becomes drawer (hamburger), one-col
     Components consume these via class hooks (.responsive-grid,
     .responsive-stack, .responsive-padding) so individual pages don't
     have to repeat media queries. */

  /* Page container padding scales with viewport — mobile gets 16/12 so
     content reaches the screen edge cleanly; desktop keeps generous
     24/28 for a calm reading width. */
  .page-padding { padding: 24px 28px 48px; }
  .page-padding-sm { padding: 18px 20px 36px; }

  /* Grid that becomes a single column under 640px, two columns at
     tablet, and admin-defined columns at desktop. Pages opt in by
     using className="responsive-grid grid-cols-3" etc. */
  .responsive-grid {
    display: grid; gap: 16px;
    grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr));
  }

  /* PageHeader actions stack below title on narrow screens so a row of
     buttons doesn't overflow and clip behind the sidebar. */
  .page-header-row {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 16px; flex-wrap: wrap;
  }

  /* Touch targets — mobile gets 44px minimum (Apple HIG). Buttons
     across the admin already use 8-11px padding which is roughly
     36px tall on desktop; bump on mobile via the .touch class. */
  @media (max-width: 900px) {
    .page-padding { padding: 20px 20px 36px; }
    .page-padding-sm { padding: 14px 16px 28px; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
  }

  /* Tables — let rows scroll horizontally instead of squashing on ANY
     viewport when columns add up to more than the container width. Without
     this, tablets and narrow desktops with wide tables (e.g. /admin#billing)
     silently clip the right-most action buttons. The .data-table-wrap class
     is applied by ui.jsx DataTable; the inline `overflow:auto` style there
     used to only kick in on mobile because of mask-image limitations. */
  .data-table-wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  /* When the table overflows its container, ui.jsx adds `.scrollable` so
     we can show a subtle right-edge shadow that hints "there's more →".
     We avoid mask-image on desktop because it dims the right-most button
     even when fully visible. */
  .data-table-wrap.scrollable {
    box-shadow: inset -12px 0 12px -12px rgba(15, 23, 42, 0.18);
  }
  .data-table-wrap.scrollable.at-end {
    box-shadow: none;
  }

  @media (max-width: 640px) {
    .page-padding { padding: 14px 14px 28px; }
    .page-padding-sm { padding: 10px 12px 22px; }
    /* Force PageHeader to stack so actions never overflow */
    .page-header-row { flex-direction: column; align-items: stretch; }
    .page-header-row > div + div { width: 100%; }
    /* Modal becomes a near-fullscreen sheet on mobile (max-height
       behaviour already there; padding adjustment helps small phones) */
    .modal-overlay { padding: 8px !important; }
    /* Toast widens to viewport */
    .toast-floating { min-width: 0 !important; left: 12px !important;
      right: 12px !important; transform: none !important; max-width: none !important; }
    /* Mobile uses a both-edges fade since the user can scroll either way
       from any starting position. */
    .data-table-wrap {
      mask-image: linear-gradient(to right, transparent 0, black 6px, black calc(100% - 6px), transparent 100%);
      -webkit-mask-image: linear-gradient(to right, transparent 0, black 6px, black calc(100% - 6px), transparent 100%);
    }
    /* Reduce headline size so it fits */
    .page-title { font-size: 19px !important; }
  }

  /* Tablet two-up break for KPI strips */
  @media (max-width: 900px) and (min-width: 641px) {
    .responsive-grid { --cols: 2 !important; }
  }
  /* Mobile single column */
  @media (max-width: 640px) {
    .responsive-grid { --cols: 1 !important; }
  }

  /* Safety net: any grid that hardcodes "1fr 1fr 1fr" or "repeat(3, 1fr)"
     becomes single-column on mobile. Pages can opt out by giving the
     element an explicit class. Without this, narrow phones see content
     overflow horizontally because cells refuse to shrink below their
     intrinsic content width. */
  @media (max-width: 640px) {
    [style*="grid-template-columns: 1fr 1fr 1fr"],
    [style*="gridTemplateColumns: '1fr 1fr 1fr'"],
    [style*="grid-template-columns: repeat(3"],
    [style*="gridTemplateColumns: 'repeat(3"] {
      grid-template-columns: 1fr !important;
    }
    [style*="grid-template-columns: 1fr 1fr"],
    [style*="gridTemplateColumns: '1fr 1fr'"] {
      grid-template-columns: 1fr !important;
    }
  }
  /* Tablet: 3-col grids collapse to 2 */
  @media (max-width: 900px) and (min-width: 641px) {
    [style*="grid-template-columns: 1fr 1fr 1fr"],
    [style*="gridTemplateColumns: '1fr 1fr 1fr'"],
    [style*="grid-template-columns: repeat(3"] {
      grid-template-columns: 1fr 1fr !important;
    }
  }

  /* Truncation guard — long words / Thai phrases that overflow narrow
     containers. Pages can opt-in by adding className="truncate". */
  .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .break-word { word-break: break-word; overflow-wrap: anywhere; }

  /* Tabs that horizontally scroll without showing an ugly scrollbar.
     Used by ui.jsx Tabs (both pills + underline variants). */
  .tabs-scroll {
    scrollbar-width: none;            /* Firefox */
    -ms-overflow-style: none;         /* IE/Edge */
  }
  .tabs-scroll::-webkit-scrollbar { display: none; }

  /* Page header actions row — already wraps at mobile via class. On
     very narrow phones (<480px) actions go full-width single column
     so the "Save" / "Export" / "Send all" buttons stack rather than
     trying to fit three on one row. */
  @media (max-width: 480px) {
    .page-header-row > div:nth-child(2) { width: 100%; flex-direction: column; }
    .page-header-row > div:nth-child(2) > * { width: 100%; }
  }

  /* KPI value scales down on narrow screens so big currency values
     ("฿1,234,567") don't break the card layout. */
  @media (max-width: 640px) {
    .kpi-value { font-size: 20px !important; }
  }

  /* Focus ring — accessible focus outline that respects category tone
     when the focused element has data-tone="..." attribute. Default
     ring is the blue 'rooms' tone since it's also the global accent. */
  *:focus-visible {
    outline: 2px solid var(--c-rooms, #2563EB);
    outline-offset: 2px;
    border-radius: 6px;
  }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body data-building-title-template="Admin Console · {building}">
<!-- Preload hints: the <script type="text/babel"> tags below execute
     sequentially (Babel needs them in order to register window.PageX
     before shell.jsx mounts React). But the BYTES can download in
     parallel — these preload hints kick off the network fetches early
     so by the time Babel reaches each script, the body is already in
     the browser cache. Without this, Babel waits ~50-300ms per script
     on a cold load. With it, total download time approaches the slowest
     single file rather than the sum. crossorigin="anonymous" matches
     what <script> uses by default for same-origin static assets. -->
<link rel="preload" as="script" href="/api-client.js">
<link rel="preload" as="script" href="/admin/shared.jsx">
<link rel="preload" as="script" href="/admin/ui.jsx">
<link rel="preload" as="script" href="/admin/hooks.jsx">
<link rel="preload" as="script" href="/admin/shell.jsx">
<!-- The 28 page-*.jsx files don't all need to preload — only the
     foundation files + shell.jsx are critical-path. Pages load on demand
     after the foundation registers their parent components. We
     intentionally DON'T preload every page file here to avoid wasting
     mobile bandwidth on routes the user never visits. -->

<div id="root"></div>

<script src="/building-branding.js"></script>
<!-- API client: hydrates localStorage from server before React mounts -->
<script src="/api-client.js"></script>

<!-- B6: production build is ~6 KB vs ~120 KB development build, no dev panels exposed. -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Foundation: must load first -->
<script type="text/babel" src="/admin/shared.jsx"></script>
<script type="text/babel" src="/admin/ui.jsx"></script>
<script type="text/babel" src="/admin/hooks.jsx"></script>

<!-- Pages: each independent, attach to window.Page* -->
<script type="text/babel" src="/admin/page-overview.jsx"></script>
<script type="text/babel" src="/admin/page-rooms.jsx"></script>
<script type="text/babel" src="/admin/page-pricing.jsx"></script>
<script type="text/babel" src="/admin/page-tenants.jsx"></script>
<script type="text/babel" src="/admin/page-bookings.jsx"></script>
<script type="text/babel" src="/admin/page-contracts.jsx"></script>
<script type="text/babel" src="/admin/page-contract-templates.jsx"></script>
<script type="text/babel" src="/admin/page-contract-invitations.jsx"></script>
<script type="text/babel" src="/admin/page-maintenance.jsx"></script>
<script type="text/babel" src="/admin/page-billing.jsx"></script>
<script type="text/babel" src="/admin/page-reports.jsx"></script>
<script type="text/babel" src="/admin/page-settings.jsx"></script>

<!-- v2 pages (feature-flag gated on the server side) -->
<script type="text/babel" src="/admin/page-features.jsx"></script>
<script type="text/babel" src="/admin/page-booking-deposit-settings.jsx"></script>
<script type="text/babel" src="/admin/page-payments.jsx"></script>
<script type="text/babel" src="/admin/page-meters.jsx"></script>
<script type="text/babel" src="/admin/page-access.jsx"></script>
<script type="text/babel" src="/admin/page-notifications.jsx"></script>
<script type="text/babel" src="/admin/page-secrets.jsx"></script>
<script type="text/babel" src="/admin/page-slip-verify.jsx"></script>
<script type="text/babel" src="/admin/page-line-bindings.jsx"></script>
<script type="text/babel" src="/admin/page-line-oas.jsx"></script>
<script type="text/babel" src="/admin/page-notifications-queue.jsx"></script>
<script type="text/babel" src="/admin/page-security-events.jsx"></script>
<script type="text/babel" src="/admin/page-access-devices.jsx"></script>
<script type="text/babel" src="/admin/page-reports-v2.jsx"></script>
<script type="text/babel" src="/admin/page-recurring-charges.jsx"></script>
<script type="text/babel" src="/admin/page-health.jsx"></script>
<script type="text/babel" src="/admin/page-production-readiness.jsx"></script>

<!-- Shell: must load last (uses everything above + renders) -->
<script type="text/babel" src="/admin/shell.jsx"></script>
</body>
</html>
