<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>กรอกสัญญาเช่า · บ้านกาญจน์ เรสซิเดนซ์</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    font-family: "IBM Plex Sans Thai", "Sora", system-ui, sans-serif;
    background: #f5efe3;
    color: #2c241b;
    -webkit-font-smoothing: antialiased;
    line-height: 1.55;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 80px; }
  .card { background: #fff; border: 1px solid #ece4d4; border-radius: 14px;
          padding: 22px; margin-bottom: 16px;
          box-shadow: 0 2px 6px -1px rgba(30,20,10,0.05); }
  h1 { font-family: 'Sora', sans-serif; font-size: 22px; margin: 0 0 4px; }
  h2 { font-family: 'Sora', sans-serif; font-size: 16px; margin: 0 0 14px;
       color: #c46a3e; }
  .muted { color: #8a7d6b; font-size: 13px; }
  label { display: block; font-size: 12px; color: #5b4f40; margin-bottom: 4px; font-weight: 500; }
  input, textarea, select {
    width: 100%; padding: 10px 12px; font: inherit; font-size: 14px;
    border: 1px solid #ece4d4; border-radius: 8px; background: #fff;
    color: #2c241b;
  }
  input:focus, textarea:focus { outline: none; border-color: #c46a3e; }
  textarea { resize: vertical; min-height: 60px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .row.single { grid-template-columns: 1fr; }
  @media (max-width: 540px) { .row { grid-template-columns: 1fr; } }
  .btn {
    padding: 11px 18px; border-radius: 9px; font: inherit; font-weight: 500;
    border: 1px solid transparent; cursor: pointer; font-size: 14px;
  }
  .btn-primary { background: #c46a3e; color: #fff; }
  .btn-primary:hover { background: #a4542d; }
  .btn-primary:disabled { background: #d8c0ad; cursor: not-allowed; }
  .btn-ghost { background: transparent; border-color: #ece4d4; color: #5b4f40; }
  .btn-ghost:hover { background: #faf6ee; }
  .btn-danger { background: #c0392b; color: #fff; }
  .step-bar { display: flex; gap: 6px; margin-bottom: 20px; }
  .step-pill { flex: 1; padding: 8px; text-align: center; border-radius: 8px;
               background: #ece4d4; color: #8a7d6b; font-size: 12px; font-weight: 500; }
  .step-pill.active { background: #c46a3e; color: #fff; }
  .step-pill.done { background: #c5e6c4; color: #2d5a2c; }
  .alert { padding: 12px 14px; border-radius: 8px; margin-bottom: 16px;
           font-size: 14px; line-height: 1.5; }
  .alert-info { background: #e8f1f8; border: 1px solid #b6d2e6; color: #234c66; }
  .alert-warn { background: #fff7e0; border: 1px solid #f1b32d; color: #6b4d10; }
  .alert-danger { background: #ffe6e3; border: 1px solid #c0392b; color: #7a1d10; }
  .alert-success { background: #e8f5e8; border: 1px solid #4a8b4a; color: #2d5a2c; }
  .upload-box {
    border: 2px dashed #ece4d4; border-radius: 10px; padding: 24px 12px;
    text-align: center; cursor: pointer; background: #faf6ee;
  }
  .upload-box:hover { border-color: #c46a3e; }
  .upload-box img { max-width: 100%; max-height: 180px; border-radius: 8px; }
  .signature-canvas {
    width: 100%; max-width: 600px; aspect-ratio: 3/1; min-height: 160px;
    background: #fff; border: 2px dashed #ece4d4; border-radius: 8px;
    cursor: crosshair; touch-action: none; display: block;
  }
  .info-list { list-style: none; padding: 0; margin: 0; }
  .info-list li {
    display: flex; justify-content: space-between; padding: 6px 0;
    border-bottom: 1px solid #f5efe3; font-size: 14px;
  }
  .info-list li:last-child { border-bottom: 0; }
  .info-list .k { color: #8a7d6b; }
  .info-list .v { font-weight: 500; }
  .terms-box {
    max-height: 200px; overflow-y: auto; padding: 12px;
    background: #faf6ee; border: 1px solid #ece4d4; border-radius: 8px;
    font-size: 13px; line-height: 1.6;
  }
</style>
</head>
<body>
<div class="wrap" id="root">
  <div class="card"><div class="muted">กำลังโหลด...</div></div>
</div>

<!-- React runtime; page logic is prebuilt into /build/contract-fill.js. -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>

<script src="/build/contract-fill.js"></script>
</body>
</html>
