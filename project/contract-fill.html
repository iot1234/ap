<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#f6f0e4"/>
<meta name="robots" content="noindex,nofollow"/>
<title>กรอกสัญญาเช่า</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
/* ============================================================
   สัญญาเช่า — Tenant contract-fill flow (production)
   Visual language ported 1:1 from the design handoff; tokens
   deliberately match project/tenant-pages.css (cream + terracotta
   + teal) so this page sits next to the other tenant pages.
   ============================================================ */
:root {
  --bg: #f6f0e4;
  --surface: #ffffff;
  --surface-2: #fdf9f1;
  --ink: #2b2218;
  --muted: #857662;
  --faint: #a99a84;
  --line: #e9dfcb;
  --line-2: #dccfb6;

  --acc: #c46a3e;
  --acc-deep: #a4542d;
  --acc-soft: #f7e4d7;
  --acc-ring: rgba(196, 106, 62, 0.22);

  --teal: #1f7a7a;
  --teal-soft: #e2f1ec;
  --green: #2f8f5b;
  --green-soft: #e3f2e7;
  --amber: #a87718;
  --amber-soft: #fdf3da;
  --red: #b3473f;
  --red-soft: #fbe7e3;

  --r-sm: 10px;
  --r: 14px;
  --r-lg: 22px;

  --shadow-card: 0 1px 2px rgba(53, 38, 23, 0.05), 0 14px 36px -26px rgba(53, 38, 23, 0.35);
  --shadow-pop: 0 28px 64px -36px rgba(53, 38, 23, 0.45);

  --font-head: "Sora", "IBM Plex Sans Thai", system-ui, sans-serif;
  --font-body: "IBM Plex Sans Thai", "Sora", system-ui, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; min-height: 100%; }

body {
  font-family: var(--font-body);
  background:
    radial-gradient(900px 420px at 85% -120px, rgba(196, 106, 62, 0.10), transparent 70%),
    radial-gradient(700px 380px at -10% 0%, rgba(31, 122, 122, 0.07), transparent 70%),
    var(--bg);
  color: var(--ink);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ---------- Shell ---------- */
.shell {
  width: min(100% - 32px, 680px);
  margin: 0 auto;
  padding: 22px 0 96px;
}

/* ---------- Top bar ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  background: rgba(246, 240, 228, 0.86);
  border-bottom: 1px solid rgba(53, 38, 23, 0.07);
}
.topbar-in {
  width: min(100% - 32px, 960px);
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
}
.brand-mark {
  width: 38px; height: 38px; flex: 0 0 auto;
  border-radius: 12px;
  background: linear-gradient(140deg, var(--acc) 0%, var(--teal) 115%);
  box-shadow: 0 8px 18px -10px rgba(164, 84, 45, 0.7);
  display: grid; place-items: center;
  color: #fff; font-family: var(--font-head); font-weight: 700; font-size: 17px;
}
.brand-text { min-width: 0; line-height: 1.25; flex: 1; }
.brand-name {
  font-family: var(--font-head); font-weight: 700; font-size: 14.5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.brand-sub { font-size: 12px; color: var(--muted); }
.topbar-spacer { flex: 1; }

.save-chip {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 6px 12px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line);
  font-size: 12px; color: var(--muted); white-space: nowrap;
}
.save-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--green);
}
.save-chip.saving .save-dot { background: var(--amber); animation: pulse-dot 1s infinite; }
.save-chip.err .save-dot { background: var(--red); }
@keyframes pulse-dot { 50% { opacity: 0.35; } }

/* ---------- Stepper ---------- */
.stepper {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  margin: 22px 0 20px;
  position: relative;
}
.step-item {
  display: flex; flex-direction: column; align-items: center; gap: 7px;
  position: relative;
  color: var(--faint);
  font-size: 12.5px; font-weight: 600;
  text-align: center;
}
.step-item .step-label { white-space: nowrap; }
.step-item::before, .step-item::after {
  content: ""; position: absolute; top: 17px; height: 2px;
  background: var(--line-2); width: calc(50% - 26px);
}
.step-item::before { left: 0; }
.step-item::after { right: 0; }
.step-item:first-child::before, .step-item:last-child::after { display: none; }
.step-item.done::before, .step-item.done::after,
.step-item.active::before { background: var(--acc); }

.step-dot {
  width: 34px; height: 34px; border-radius: 50%;
  display: grid; place-items: center;
  font-family: var(--font-head); font-weight: 700; font-size: 14px;
  background: var(--surface); border: 2px solid var(--line-2);
  color: var(--faint);
  transition: all 0.25s ease;
}
.step-item.active { color: var(--ink); }
.step-item.active .step-dot {
  border-color: var(--acc); color: var(--acc);
  box-shadow: 0 0 0 5px var(--acc-ring);
}
.step-item.done { color: var(--muted); }
.step-item.done .step-dot {
  background: var(--acc); border-color: var(--acc); color: #fff;
}

/* ---------- Cards ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: clamp(20px, 3.5vw, 30px);
  box-shadow: var(--shadow-card);
  margin-bottom: 16px;
}
.card.card-soft { background: var(--surface-2); box-shadow: none; }

.eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--acc-deep);
  margin-bottom: 8px;
  white-space: nowrap;
}
.eyebrow::before {
  content: ""; width: 18px; height: 2px; border-radius: 2px; background: var(--acc);
}
h1.title {
  font-family: var(--font-head);
  font-size: clamp(23px, 4vw, 30px);
  font-weight: 700; line-height: 1.2;
  margin: 0 0 6px;
  text-wrap: pretty;
}
h2.section-title {
  font-family: var(--font-head);
  font-size: 17px; font-weight: 700;
  margin: 0 0 4px;
}
.section-desc { font-size: 13.5px; color: var(--muted); margin: 0 0 16px; }
.muted { color: var(--muted); font-size: 13px; }

/* ---------- Forms ---------- */
.field { margin-bottom: 14px; }
.field > label {
  display: block; font-size: 13px; font-weight: 600;
  color: #5c4f3e; margin-bottom: 6px;
}
.field .req { color: var(--acc); }
.field .hint { font-size: 12px; color: var(--faint); margin-top: 5px; }
.field .hint.bad { color: var(--red); font-weight: 600; }

input[type="text"], input[type="tel"], textarea, select {
  width: 100%;
  min-height: 46px;
  padding: 11px 14px;
  font: inherit; font-size: 14.5px;
  color: var(--ink);
  background: var(--surface);
  border: 1.5px solid var(--line-2);
  border-radius: 12px;
  transition: border-color 0.15s, box-shadow 0.15s;
}
textarea { resize: vertical; min-height: 92px; line-height: 1.55; }
input:focus, textarea:focus, select:focus {
  outline: none;
  border-color: var(--acc);
  box-shadow: 0 0 0 4px var(--acc-ring);
}
input::placeholder, textarea::placeholder { color: #c0b29c; }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-grid > .field { margin-bottom: 0; }
@media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px;
  padding: 12px 22px;
  border-radius: 13px;
  font: inherit; font-size: 15px; font-weight: 600;
  border: 1.5px solid transparent;
  cursor: pointer;
  transition: transform 0.1s ease, background 0.15s, box-shadow 0.15s;
  text-decoration: none;
  white-space: nowrap;
}
.btn:active { transform: translateY(1px); }
.btn:focus-visible { outline: none; box-shadow: 0 0 0 4px var(--acc-ring); }
.btn-primary {
  background: linear-gradient(180deg, var(--acc) 0%, var(--acc-deep) 130%);
  color: #fff;
  box-shadow: 0 10px 22px -12px rgba(164, 84, 45, 0.65);
}
.btn-primary:hover:not(:disabled) { filter: brightness(1.06); }
.btn-primary:disabled {
  background: #ddcdb9; color: #fffaf2;
  box-shadow: none; cursor: not-allowed;
}
.btn-ghost {
  background: var(--surface);
  border-color: var(--line-2);
  color: #5c4f3e;
}
.btn-ghost:hover:not(:disabled) { background: var(--surface-2); border-color: var(--acc); color: var(--acc-deep); }
.btn-ghost:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-block { width: 100%; }
.btn-sm { min-height: 38px; padding: 8px 14px; font-size: 13.5px; border-radius: 10px; }

.footer-nav { display: flex; gap: 10px; margin-top: 22px; }
.footer-nav .btn-primary { flex: 1; }

/* ---------- Chips, alerts, info ---------- */
.chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px;
  min-height: 34px; padding: 6px 13px;
  border-radius: 999px;
  background: var(--teal-soft); color: var(--teal);
  border: 1px solid rgba(31, 122, 122, 0.18);
  font-size: 12.5px; font-weight: 600;
  white-space: nowrap;
}

.alert {
  display: flex; gap: 10px;
  padding: 13px 15px; border-radius: var(--r);
  font-size: 14px; line-height: 1.55;
  margin-bottom: 16px;
  border: 1px solid;
}
.alert-info  { background: var(--teal-soft);  border-color: rgba(31,122,122,0.25); color: #155e5e; }
.alert-warn  { background: var(--amber-soft); border-color: rgba(168,119,24,0.3);  color: #7a5610; }
.alert-danger{ background: var(--red-soft);   border-color: rgba(179,71,63,0.3);   color: #8c322b; }
.alert-success{ background: var(--green-soft);border-color: rgba(47,143,91,0.3);   color: #20663f; }

.info-grid { display: grid; gap: 0; }
.info-row {
  display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
  padding: 10px 2px;
  border-bottom: 1px dashed var(--line);
  font-size: 14.5px;
}
.info-row:last-child { border-bottom: 0; }
.info-row .k { color: var(--muted); font-size: 13.5px; flex: 0 0 auto; white-space: nowrap; }
.info-row .v { font-weight: 600; text-align: right; overflow-wrap: anywhere; }
.info-row .v.acc { color: var(--acc-deep); font-family: var(--font-head); }

/* ---------- Upload box ---------- */
.upload-box {
  border: 2px dashed var(--line-2);
  border-radius: var(--r);
  background: var(--surface-2);
  min-height: 148px;
  display: grid; place-items: center;
  text-align: center;
  cursor: pointer;
  padding: 14px;
  transition: border-color 0.15s, background 0.15s;
  position: relative;
  overflow: hidden;
}
.upload-box:hover { border-color: var(--acc); background: var(--acc-soft); }
.upload-box:focus-visible { outline: none; border-color: var(--acc); box-shadow: 0 0 0 4px var(--acc-ring); }
.upload-box.is-busy { pointer-events: none; opacity: 0.72; }
.upload-box img {
  max-width: 100%; max-height: 150px;
  border-radius: 8px; display: block;
}
.upload-glyph { font-size: 26px; line-height: 1; margin-bottom: 6px; }
.upload-ok {
  position: absolute; top: 8px; right: 8px;
  background: var(--green); color: #fff;
  font-size: 11px; font-weight: 700;
  padding: 3px 9px; border-radius: 999px;
}
.upload-busy-tag {
  position: absolute; top: 8px; right: 8px;
  background: var(--amber); color: #fff;
  font-size: 11px; font-weight: 700;
  padding: 3px 9px; border-radius: 999px;
}

/* ---------- Signature ---------- */
.signature-wrap { position: relative; }
.signature-canvas {
  width: 100%; aspect-ratio: 3 / 1; min-height: 170px;
  display: block;
  background: var(--surface);
  border: 2px dashed var(--line-2);
  border-radius: var(--r);
  cursor: crosshair; touch-action: none;
}
.signature-hint {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  color: #cfc1a9; font-size: 14px;
  pointer-events: none;
  padding: 0 14px; text-align: center;
}
.signature-line {
  position: absolute; left: 12%; right: 12%; bottom: 26%;
  border-bottom: 1.5px solid var(--line-2);
  pointer-events: none;
}

/* ---------- Terms ---------- */
.terms-box {
  max-height: 220px; overflow-y: auto;
  padding: 14px 16px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--r);
  font-size: 13.5px; line-height: 1.7;
}
.terms-box ol { margin: 0; padding-left: 20px; display: grid; gap: 8px; }

.consent {
  display: flex; gap: 11px; align-items: flex-start;
  margin-top: 14px; padding: 13px 14px;
  border: 1.5px solid var(--line);
  border-radius: var(--r);
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
  font-size: 14px;
}
.consent:hover { border-color: var(--acc); }
.consent.checked { border-color: var(--acc); background: var(--acc-soft); }
.consent input { width: 19px; height: 19px; margin: 2px 0 0; accent-color: var(--acc); flex: 0 0 auto; }

/* ---------- Review (step 3) ---------- */
.review-group { margin-bottom: 18px; }
.review-group-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 6px;
}
.review-group-head h3 {
  margin: 0; font-size: 13px; font-weight: 700;
  color: var(--muted); letter-spacing: 0.04em;
  white-space: nowrap;
}
.review-edit {
  background: none; border: none; padding: 2px 4px;
  font: inherit; font-size: 12.5px; font-weight: 600;
  color: var(--teal); cursor: pointer; text-decoration: underline;
}
.review-thumbs { display: flex; gap: 10px; flex-wrap: wrap; }
.review-thumbs img {
  width: 96px; height: 62px; object-fit: cover;
  border-radius: 8px; border: 1px solid var(--line);
}
.review-thumb-chip {
  width: 96px; height: 62px;
  display: grid; place-items: center;
  border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface-2);
  font-size: 11.5px; font-weight: 600; color: var(--green);
  text-align: center; padding: 4px;
}

/* ---------- Status: timeline ---------- */
.timeline { display: grid; gap: 0; margin: 6px 0; }
.tl-item { display: grid; grid-template-columns: 38px 1fr; gap: 0 14px; }
.tl-rail { display: flex; flex-direction: column; align-items: center; }
.tl-dot {
  width: 30px; height: 30px; border-radius: 50%; flex: 0 0 auto;
  display: grid; place-items: center;
  font-size: 14px; font-weight: 700;
  background: var(--surface-2); border: 2px solid var(--line-2); color: var(--faint);
  z-index: 1;
}
.tl-line { width: 2px; flex: 1; background: var(--line-2); min-height: 26px; }
.tl-item.done .tl-dot { background: var(--green); border-color: var(--green); color: #fff; }
.tl-item.done .tl-line { background: var(--green); }
.tl-item.current .tl-dot {
  background: var(--surface); border-color: var(--acc); color: var(--acc);
  box-shadow: 0 0 0 5px var(--acc-ring);
}
@media (prefers-reduced-motion: no-preference) {
  .tl-item.current .tl-dot { animation: tl-pulse 1.8s ease-in-out infinite; }
}
@keyframes tl-pulse {
  0%, 100% { box-shadow: 0 0 0 4px var(--acc-ring); }
  50% { box-shadow: 0 0 0 9px rgba(196, 106, 62, 0.08); }
}
.tl-body { padding-bottom: 22px; }
.tl-item:last-child .tl-body { padding-bottom: 4px; }
.tl-item:last-child .tl-line { display: none; }
.tl-title { font-weight: 700; font-size: 15px; }
.tl-item.pending .tl-title { color: var(--faint); font-weight: 600; }
.tl-meta { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.tl-badge {
  display: inline-block; margin-left: 8px;
  font-size: 11px; font-weight: 700;
  background: var(--acc-soft); color: var(--acc-deep);
  padding: 2px 9px; border-radius: 999px;
  vertical-align: 2px;
}

/* ---------- Status: medallion ---------- */
.medallion-wrap { display: grid; place-items: center; padding: 6px 0 2px; }
.medallion {
  width: 92px; height: 92px; border-radius: 50%;
  display: grid; place-items: center;
  font-size: 40px; line-height: 1;
  position: relative;
}
.medallion::before, .medallion::after {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
}
.medallion::before { inset: -14px; border: 1.5px solid; opacity: 0.25; }
.medallion::after { inset: -28px; border: 1.5px solid; opacity: 0.12; }
.medallion.tone-green  { background: var(--green-soft); color: var(--green); }
.medallion.tone-green::before, .medallion.tone-green::after { border-color: var(--green); }
.medallion.tone-amber  { background: var(--amber-soft); color: var(--amber); }
.medallion.tone-amber::before, .medallion.tone-amber::after { border-color: var(--amber); }
.medallion.tone-red    { background: var(--red-soft); color: var(--red); }
.medallion.tone-red::before, .medallion.tone-red::after { border-color: var(--red); }
.medallion.tone-neutral{ background: var(--surface-2); color: var(--faint); }
.medallion.tone-neutral::before, .medallion.tone-neutral::after { border-color: var(--line-2); }
.medallion.tone-acc    { background: var(--acc-soft); color: var(--acc); }
.medallion.tone-acc::before, .medallion.tone-acc::after { border-color: var(--acc); }

.medallion svg { width: 46px; height: 46px; }

@media (prefers-reduced-motion: no-preference) {
  .pop-in { animation: pop-in 0.5s cubic-bezier(0.2, 1.4, 0.4, 1); }
}
@keyframes pop-in {
  from { transform: scale(0.4); }
}

.status-center { text-align: center; }
.status-center .title { margin-top: 14px; }
.status-lead { color: var(--muted); font-size: 14.5px; max-width: 440px; margin: 0 auto; text-wrap: pretty; }

/* ---------- Contact card ---------- */
.contact-card {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
}
.contact-avatar {
  width: 46px; height: 46px; border-radius: 50%; flex: 0 0 auto;
  background: linear-gradient(140deg, var(--acc) 0%, var(--teal) 115%);
  display: grid; place-items: center;
  color: #fff; font-family: var(--font-head); font-weight: 700; font-size: 18px;
}
.contact-body { flex: 1; min-width: 140px; line-height: 1.4; }
.contact-name { font-weight: 700; font-size: 14.5px; }
.contact-sub { font-size: 12.5px; color: var(--muted); }
.contact-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- Next steps ---------- */
.next-steps { display: grid; gap: 10px; margin-top: 4px; }
.next-step {
  display: flex; gap: 13px; align-items: flex-start;
  padding: 13px 15px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--r);
}
.next-step-num {
  width: 28px; height: 28px; border-radius: 50%; flex: 0 0 auto;
  display: grid; place-items: center;
  background: var(--acc-soft); color: var(--acc-deep);
  font-family: var(--font-head); font-weight: 700; font-size: 13px;
}
.next-step-title { font-weight: 700; font-size: 14.5px; }
.next-step-desc { font-size: 13px; color: var(--muted); margin-top: 1px; }

/* ---------- Welcome hero ---------- */
.welcome-hero {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 200px;
  gap: 20px;
  align-items: center;
}
.welcome-mascot { justify-self: center; }
.welcome-mascot img {
  width: 180px; height: 170px; object-fit: contain;
  filter: drop-shadow(0 20px 18px rgba(60, 39, 22, 0.16));
  user-select: none; pointer-events: none;
}
@media (max-width: 620px) {
  .welcome-hero { grid-template-columns: 1fr; }
  .welcome-mascot { order: -1; }
}

/* ---------- Screen transitions ---------- */
@media (prefers-reduced-motion: no-preference) {
  .screen-enter { animation: screen-enter 0.35s ease; }
}
@keyframes screen-enter {
  from { transform: translateY(10px); opacity: 0; }
}

/* ---------- Confetti ---------- */
.confetti-layer {
  position: fixed; inset: 0; pointer-events: none; z-index: 80; overflow: hidden;
}
.confetti-piece {
  position: absolute; top: -16px;
  width: 9px; height: 14px;
  border-radius: 2px;
  animation: confetti-fall linear forwards;
}
@keyframes confetti-fall {
  to { transform: translateY(105vh) rotate(720deg); opacity: 0.7; }
}

/* ---------- Mobile ---------- */
@media (max-width: 560px) {
  .shell { padding-top: 16px; }
  .stepper { margin: 18px 0 16px; }
  .step-item { font-size: 11px; }
  .step-item .step-label { white-space: normal; max-width: 96px; }
  .footer-nav .btn-ghost { min-width: 110px; }
}
</style>
</head>
<body>
<div id="root">
  <main class="shell">
    <section class="card"><div class="muted">กำลังโหลด…</div></section>
  </main>
</div>

<script type="text/babel">
'use strict';
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* ============== Helpers ============== */
const cx = (...a) => a.filter(Boolean).join(' ');

function fmtTHB(n) {
  return Number(n || 0).toLocaleString('th-TH', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}
function fmtThaiDate(s) {
  if (!s) return '—';
  try {
    const d = new Date(s);
    if (!Number.isFinite(d.getTime())) return String(s);
    return d.toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });
  } catch { return String(s); }
}
function fmtThaiTime(d) {
  try { return d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }); } catch { return ''; }
}
const digitsOnly = (v) => String(v || '').replace(/[^0-9]/g, '');

// Live re-format to X-XXXX-XXXXX-XX-X, capped at 13 digits.
function formatCitizenId(raw) {
  const d = digitsOnly(raw).slice(0, 13);
  const parts = [d.slice(0, 1), d.slice(1, 5), d.slice(5, 10), d.slice(10, 12), d.slice(12, 13)];
  return parts.filter(Boolean).join('-');
}

// Thai national ID mod-11 checksum — the server validates this on submit
// (services/thaiId), so checking client-side prevents a dead-end INCOMPLETE
// after the tenant has already drawn their signature.
function isValidThaiId(raw) {
  const d = digitsOnly(raw);
  if (d.length !== 13) return false;
  let sum = 0;
  for (let i = 0; i < 12; i += 1) sum += Number(d[i]) * (13 - i);
  return (11 - (sum % 11)) % 10 === Number(d[12]);
}

// Token comes from the path /contract/fill/<token>. Never persisted anywhere
// else (no localStorage / cookies) — it IS the credential for this page.
const tokenFromUrl = (() => {
  const m = window.location.pathname.match(/\/contract\/fill\/([A-Za-z0-9_-]+)/);
  return m ? m[1] : '';
})();

const FATAL_CODES = new Set(['TOKEN_INVALID', 'REVOKED', 'EXPIRED', 'ALREADY_APPROVED']);

async function api(path, opts = {}) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 25_000);
  let r;
  try {
    r = await fetch(path, {
      method: opts.method || 'GET',
      headers: { 'Content-Type': 'application/json' },
      body: opts.body != null ? JSON.stringify(opts.body) : undefined,
      signal: ctrl.signal,
      keepalive: opts.keepalive === true,
    });
  } catch (e) {
    clearTimeout(timer);
    const err = new Error('NETWORK');
    err.code = e && e.name === 'AbortError' ? 'TIMEOUT' : 'NETWORK';
    throw err;
  }
  clearTimeout(timer);
  let j = null;
  try { j = await r.json(); } catch { /* non-JSON body */ }
  if (!r.ok) {
    const err = new Error((j && j.error) || `HTTP ${r.status}`);
    err.status = r.status;
    err.code = (j && j.code) || (r.status === 429 ? 'RATE_LIMITED' : null);
    err.body = j;
    throw err;
  }
  return j;
}

function friendlyErrorText(err) {

    ALREADY_APPROVED: 'สัญญาได้รับการอนุมัติแล้ว — คุณไม่ต้องดำเนินการต่อ',
    TOKEN_INVALID: 'ลิงก์นี้ใช้ไม่ได้ — กรุณาติดต่อเจ้าของหอพัก',
    NOT_EDITABLE: 'ส่งสัญญาให้ตรวจสอบแล้ว — รอเจ้าของหอพักรีวิว',
    RATE_LIMITED: 'มีการเรียกใช้งานถี่เกินไป — กรุณารอสักครู่แล้วลองใหม่',
    TIMEOUT: 'เชื่อมต่อช้าผิดปกติ — ตรวจอินเทอร์เน็ตแล้วลองใหม่อีกครั้ง',
    NETWORK: 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ — ตรวจอินเทอร์เน็ตแล้วลองใหม่อีกครั้ง',
  };
  return map[err && err.code] || (err && err.message) || 'เกิดข้อผิดพลาด';
}

// Which fill step a "ขอให้แก้ไข" reason most likely points at.
function guessFixStep(reason) {
  const t = String(reason || '');
  if (/ลายเซ็น|เซ็น|ลงนาม/.test(t)) return 3;
  if (/บัตร|รูป|ภาพ|ถ่าย|id/i.test(t)) return 2;
  return 1;
}

// Draft payload sent to PUT/submit — exactly the keys the server sanitises
// (services/contractInvitation.sanitiseDraft). Citizen ID goes as digits.
function draftPayload(d) {
  return {
    address: d.address || '',
    emergencyContactName: d.emergencyContactName || '',
    emergencyContactPhone: d.emergencyContactPhone || '',
    emergencyContactRelation: d.emergencyContactRelation || '',
    citizenId: digitsOnly(d.citizenId),
    citizenIdImageFrontId: d.citizenIdImageFrontId || null,
    citizenIdImageBackId: d.citizenIdImageBackId || null,
    signatureFileId: d.signatureFileId || null,

}

function UploadBox({ label, required, preview, attached, busy, errText, onPickFile }) {
  const inputRef = useRef(null);

  const onFile = (e) => {

/* ============== Signature pad ============== */
function SignaturePad({ onInkChange, padRef }) {
  const canvasRef = useRef(null);
  const [hasInk, setHasInk] = useState(false);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    canvas.width = 660; canvas.height = 220;
    const ctx = canvas.getContext('2d');
    // White background (not transparent) so the exported PNG renders the
    // same on the contract PDF regardless of what it's composited onto.
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#241b13';
    ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    let drawing = false, lastX = 0, lastY = 0;
    const pos = (e) => {
      const rect = canvas.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      return {
        x: (t.clientX - rect.left) * (canvas.width / rect.width),
        y: (t.clientY - rect.top) * (canvas.height / rect.height),
      };
    };
    const start = (e) => { e.preventDefault(); drawing = true; const p = pos(e); lastX = p.x; lastY = p.y; };
    const move = (e) => {
      if (!drawing) return;
      e.preventDefault();
      const p = pos(e);
      ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(p.x, p.y); ctx.stroke();
      lastX = p.x; lastY = p.y;
      setHasInk(true);
    };
    const end = () => { drawing = false; };
    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);
    canvas.addEventListener('mouseleave', end);
    canvas.addEventListener('touchstart', start, { passive: false });
    canvas.addEventListener('touchmove', move, { passive: false });
    canvas.addEventListener('touchend', end);
    return () => {
      canvas.removeEventListener('mousedown', start);
      canvas.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', end);
      canvas.removeEventListener('mouseleave', end);
      canvas.removeEventListener('touchstart', start);
      canvas.removeEventListener('touchmove', move);
      canvas.removeEventListener('touchend', end);
    };
  }, []);

  useEffect(() => { if (onInkChange) onInkChange(hasInk); }, [hasInk]);

  useEffect(() => {
    if (!padRef) return;
    padRef.current = {
      clear() {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        setHasInk(false);
      },
      toDataURL() {
        return hasInk && canvasRef.current ? canvasRef.current.toDataURL('image/png') : null;
      },
    };
  }, [hasInk, padRef]);

  return (
    <div className="signature-wrap">
      <canvas ref={canvasRef} className="signature-canvas" aria-label="พื้นที่ลงลายมือชื่อ"></canvas>
      <div className="signature-line"></div>
      {!hasInk ? <div className="signature-hint">✍️ เซ็นด้วยนิ้วบนมือถือ หรือเมาส์บนคอมพิวเตอร์</div> : null}
    </div>
  );
}

function Confetti({ fire }) {
  const [pieces, setPieces] = useState([]);
  useEffect(() => {
    if (!fire) return;
    if (!window.matchMedia('(prefers-reduced-motion: no-preference)').matches) return;
    const colors = ['#c46a3e', '#1f7a7a', '#e3b23c', '#2f8f5b', '#b3473f', '#7a5ae0'];
    const arr = Array.from({ length: 90 }, (_, i) => ({
      id: i,
      left: Math.random() * 100,
      delay: Math.random() * 0.9,
      dur: 2.6 + Math.random() * 2.2,
      color: colors[i % colors.length],
      w: 6 + Math.random() * 6,
      h: 10 + Math.random() * 8,
    }));
    setPieces(arr);
    const t = setTimeout(() => setPieces([]), 6200);
    return () => clearTimeout(t);
  }, [fire]);
  if (!pieces.length) return null;
  return (
    <div className="confetti-layer" aria-hidden="true">
      {pieces.map((p) => (
        <span key={p.id} className="confetti-piece" style={{
          left: `${p.left}%`,
          width: p.w, height: p.h,
          background: p.color,
          animationDuration: `${p.dur}s`,
          animationDelay: `${p.delay}s`,
        }}></span>
      ))}
    </div>
  );
}

            value={draft.address || ''}

        <div className="form-grid">
          <Field label="ชื่อ-นามสกุล" required>

            <input type="tel" maxLength={20} placeholder="081-234-5678" inputMode="tel" autoComplete="off"

            value={draft.emergencyContactRelation || ''}

function StepIdentity({ draft, setField, uploads, onUpload, onBack, onNext }) {
  const digits = digitsOnly(draft.citizenId);
  const idComplete = digits.length === 13;
  const idValid = idComplete && isValidThaiId(digits);
  const ok = idValid && draft.citizenIdImageFrontId && draft.citizenIdImageBackId
    && !uploads.front.busy && !uploads.back.busy;
  return (
    <div className="screen-enter">
      <Card>
        <SectionHead eyebrow="ขั้นตอนที่ 2 จาก 3" title="ยืนยันตัวตน"
          desc="เลขบัตรประชาชนถูกเข้ารหัส (AES-256) ก่อนจัดเก็บ และใช้เพื่อทำสัญญาเท่านั้น" />
        <Field label="เลขบัตรประชาชน 13 หลัก" required
          hint={
            digits.length > 0 && digits.length < 13 ? `กรอกแล้ว ${digits.length}/13 หลัก`
            : idComplete && !idValid ? 'เลขบัตรไม่ถูกต้อง (ตรวจเลขหลักท้ายอีกครั้ง)'
            : null
          }
          hintBad={idComplete && !idValid}>
          <input type="text" inputMode="numeric" maxLength={17} placeholder="X-XXXX-XXXXX-XX-X"
            autoComplete="off"
            value={draft.citizenId || ''}
            onChange={(e) => setField('citizenId', formatCitizenId(e.target.value))} />
        </Field>
        <div className="form-grid" style={{ marginTop: 6 }}>
          <UploadBox label="ภาพถ่ายหน้าบัตร" required
            preview={uploads.front.preview}
            attached={!!draft.citizenIdImageFrontId}
            busy={uploads.front.busy}
            errText={uploads.front.err}
            onPickFile={(f) => onUpload('front', f)} />
          <UploadBox label="ภาพถ่ายหลังบัตร" required
            preview={uploads.back.preview}
            attached={!!draft.citizenIdImageBackId}
            busy={uploads.back.busy}
            errText={uploads.back.err}
            onPickFile={(f) => onUpload('back', f)} />
        </div>
        <Alert tone="info">
          💡 ถ่ายในที่สว่าง ให้เห็นเลขบัตรครบทุกหลัก ไม่มีแสงสะท้อน — ไฟล์ละไม่เกิน 1.5MB
        </Alert>
        <FooterNav onBack={onBack} onNext={onNext} nextDisabled={!ok} />
      </Card>
    </div>
  );
}

    tone: 'red', glyph: '✕', title: 'ลิงก์นี้ถูกยกเลิกแล้ว',
    lead: 'เจ้าของหอพักได้ยกเลิกลิงก์นี้ อาจเป็นเพราะมีการออกลิงก์ใหม่ หรือรายละเอียดสัญญามีการเปลี่ยนแปลง',
    note: 'ติดต่อเจ้าของหอพักเพื่อสอบถามและขอรับลิงก์ฉบับล่าสุด',
  },
  invalid: {
    tone: 'neutral', glyph: '?', title: 'ไม่พบลิงก์นี้ในระบบ',
    lead: 'ลิงก์อาจถูกพิมพ์ผิด หรือคัดลอกมาไม่ครบ ลองเปิดจากข้อความที่ได้รับอีกครั้ง',
    note: 'หากยังเปิดไม่ได้ ติดต่อเจ้าของหอพักเพื่อขอลิงก์ใหม่',
  },
};

function DeadLinkScreen({ kind, view }) {
  const c = DEAD_LINK_COPY[kind] || DEAD_LINK_COPY.invalid;
  return (
    <div className="screen-enter">
      <Card className="status-center">
        <Medallion tone={c.tone} pop>{c.glyph}</Medallion>
        <h1 className="title">{c.title}</h1>
        <p className="status-lead">{c.lead}</p>
        <div style={{ maxWidth: 440, margin: '16px auto 0', textAlign: 'left' }}>
          <Alert tone="info">{c.note}</Alert>
        </div>
      </Card>
      <ContactCard building={view && view.building} title="ขอลิงก์ใหม่ / สอบถาม" />
    </div>
  );
}

/* ============== Main app — state machine wired to the real API ============== */
// phase: 'loading' | 'welcome' | 'fill' | 'waiting' | 'success' | 'dead'
function App() {
  const [phase, setPhase] = useState('loading');
  const [deadKind, setDeadKind] = useState(null);       // 'expired'|'revoked'|'invalid'
  const [view, setView] = useState(null);
  const [step, setStep] = useState(1);
  const [draft, setDraft] = useState({});
  const [submittedAt, setSubmittedAt] = useState(null);
  const [busy, setBusy] = useState(false);
  const [saving, setSaving] = useState(false);
  const [savedAt, setSavedAt] = useState(null);
  const [saveErr, setSaveErr] = useState(false);
  const [formError, setFormError] = useState(null);
  const [uploads, setUploads] = useState({
    front: { preview: null, busy: false, err: null },
    back: { preview: null, busy: false, err: null },
  });

  // Step-3 signing state lives here so step navigation doesn't lose it.
  const padRef = useRef(null);
  const [hasInk, setHasInk] = useState(false);
  const [agreed, setAgreed] = useState(false);

  // Latest draft snapshot for the unload flush (avoids stale closure).
  const draftRef = useRef(draft);
  useEffect(() => { draftRef.current = draft; }, [draft]);
  const phaseRef = useRef(phase);
  useEffect(() => { phaseRef.current = phase; }, [phase]);
  const lastSavedJSONRef = useRef('');

  const scrollTop = () => window.scrollTo({ top: 0 });
  const gotoStep = (n) => { setStep(n); setFormError(null); scrollTop(); };

  // Terminal server codes → which screen. Returns true when handled.
  const routeFatal = useCallback((err) => {
    switch (err && err.code) {
      case 'ALREADY_APPROVED': setPhase('success'); scrollTop(); return true;
      case 'REVOKED': setDeadKind('revoked'); setPhase('dead'); scrollTop(); return true;
      case 'EXPIRED': setDeadKind('expired'); setPhase('dead'); scrollTop(); return true;
      case 'TOKEN_INVALID': setDeadKind('invalid'); setPhase('dead'); scrollTop(); return true;
      case 'NOT_EDITABLE': setPhase('waiting'); scrollTop(); return true;
      default: return false;
    }
  }, []);

  // Adopt a server view payload: prefill draft + decide the screen.
  const adoptView = useCallback((v) => {
    setView(v);
    const d = v.draft || {};
    setDraft({
      ...d,
      citizenId: d.citizenId ? formatCitizenId(d.citizenId) : (d.citizenId || ''),
    });
    lastSavedJSONRef.current = '';   // recompute dirty-state against fresh data
    if (v.status === 'submitted') {
      setPhase('waiting');
    } else if (v.rejectionReason) {
      // Admin requested changes (status flipped back to pending + reason).
      setPhase('fill');
      setStep(guessFixStep(v.rejectionReason));
    } else {
      setPhase('welcome');
    }
  }, []);

  // Initial load
  useEffect(() => {
    if (!tokenFromUrl) {
      setDeadKind('invalid');
      setPhase('dead');
      return;
    }
    let alive = true;
    api(`/api/contract-fill/${tokenFromUrl}`)
      .then((res) => { if (alive) adoptView(res.view); })
      .catch((err) => {
        if (!alive) return;
        if (!routeFatal(err)) {
          // Network/5xx on first load — no data to show; treat as invalid
          // with a retry hint rather than a blank page.
          setFormError(friendlyErrorText(err));
          setDeadKind('invalid');
          setPhase('dead');
        }
      });
    return () => { alive = false; };
  }, [adoptView, routeFatal]);

  // Page title follows the building name (never put the token in the title).
  useEffect(() => {
    const name = String(view?.building?.name || '').trim() || 'ที่พักของคุณ';
    document.title = `กรอกสัญญาเช่า · ${name}`;
  }, [view]);

  /* ---- Auto-save (debounced 800ms, PUT /api/contract-fill/:token) ---- */
  const firstSaveRun = useRef(true);
  useEffect(() => {
    if (phase !== 'welcome' && phase !== 'fill') return;
    if (!view || view.status !== 'pending') return;
    const payload = draftPayload(draft);
    const json = JSON.stringify(payload);
    if (firstSaveRun.current) {
      // First render after adopt: record the baseline, don't PUT untouched data.
      firstSaveRun.current = false;
      lastSavedJSONRef.current = json;
      return;
    }
    if (json === lastSavedJSONRef.current) return;
    setSaving(true);
    const t = setTimeout(async () => {
      try {
        await api(`/api/contract-fill/${tokenFromUrl}`, { method: 'PUT', body: payload });
        lastSavedJSONRef.current = json;
        setSavedAt(new Date());
        setSaveErr(false);
      } catch (err) {
        // Terminal failure = the link died under us — reroute immediately
        // instead of letting the tenant keep typing into a dead form.
        if (!routeFatal(err)) setSaveErr(true);
      } finally {
        setSaving(false);
      }
    }, 800);
    return () => clearTimeout(t);
  }, [draft, phase, view, routeFatal]);

  // Flush unsaved edits when the tab is hidden/closed (keepalive fetch).
  useEffect(() => {
    const flush = () => {
      if (phaseRef.current !== 'welcome' && phaseRef.current !== 'fill') return;
      const payload = draftPayload(draftRef.current);
      const json = JSON.stringify(payload);
      if (json === lastSavedJSONRef.current) return;
      // Mark saved only on confirmed success — if the keepalive PUT dies,
      // the next edit / 'online' event retries instead of losing the edits.
      api(`/api/contract-fill/${tokenFromUrl}`, { method: 'PUT', body: payload, keepalive: true })
        .then(() => { lastSavedJSONRef.current = json; })
        .catch(() => {});
    };
    const onHide = () => { if (document.visibilityState === 'hidden') flush(); };
    document.addEventListener('visibilitychange', onHide);
    window.addEventListener('pagehide', flush);
    return () => {
      document.removeEventListener('visibilitychange', onHide);
      window.removeEventListener('pagehide', flush);
    };
  }, []);

  // Retry a failed auto-save when connectivity returns.
  useEffect(() => {
    const onOnline = () => {
      if (saveErr) {
        lastSavedJSONRef.current = '';
        setDraft((d) => ({ ...d }));   // re-trigger the save effect
      }
    };
    window.addEventListener('online', onOnline);
    return () => window.removeEventListener('online', onOnline);
  }, [saveErr]);

  /* ---- Waiting-phase polling: auto-advance on approve / reopen on reject ---- */
  useEffect(() => {
    if (phase !== 'waiting' || !tokenFromUrl) return;
    let stopped = false;
    const check = async () => {
      try {
        const res = await api(`/api/contract-fill/${tokenFromUrl}`);
        if (stopped) return;
        if (res.view && res.view.status === 'pending') {
          // Admin rejected with a reason — reopen the form in fix mode.
          adoptView(res.view);
          scrollTop();
        }
      } catch (err) {
        if (stopped) return;
        if (err.code === 'ALREADY_APPROVED') {
          // Keep the rich view we already have → full success screen.
          setPhase('success');
          scrollTop();
        } else if (err.code === 'REVOKED') {
          setDeadKind('revoked'); setPhase('dead'); scrollTop();
        }
        // Network blips / rate limits: stay silent, try again next tick.
      }
    };
    const iv = setInterval(check, 30_000);
    const onVis = () => { if (document.visibilityState === 'visible') check(); };
    document.addEventListener('visibilitychange', onVis);
    return () => {
      stopped = true;
      clearInterval(iv);
      document.removeEventListener('visibilitychange', onVis);
    };
  }, [phase, adoptView]);

  /* ---- Field + upload handlers ---- */
  const setField = (k, v) => setDraft((d) => ({ ...d, [k]: v }));

  const setUploadState = (kind, patch) =>
    setUploads((u) => ({ ...u, [kind]: { ...u[kind], ...patch } }));

  const handleUpload = async (kind, file) => {
    setFormError(null);
    setUploadState(kind, { err: null });
    if (!/^image\/(jpeg|png|webp)$/.test(file.type || '')) {
      setUploadState(kind, { err: 'รองรับเฉพาะไฟล์รูป JPG, PNG หรือ WebP' });
      return;
    }
    if (file.size > 1_500_000) {
      setUploadState(kind, { err: 'ไฟล์ใหญ่เกิน 1.5MB — ถ่ายใหม่หรือลดความละเอียดลง' });
      return;
    }
    const dataUrl = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (ev) => resolve(ev.target.result);
      reader.onerror = () => reject(new Error('READ_FAILED'));
      reader.readAsDataURL(file);
    }).catch(() => null);
    if (!dataUrl) {
      setUploadState(kind, { err: 'อ่านไฟล์ไม่สำเร็จ — ลองเลือกรูปอีกครั้ง' });
      return;
    }
    const prevPreview = uploads[kind].preview;
    setUploadState(kind, { preview: dataUrl, busy: true });
    try {
      const out = await api(`/api/contract-fill/${tokenFromUrl}/upload`, {
        method: 'POST', body: { kind, dataUrl },
      });
      // The server already persisted the file id into the draft (closes the
      // upload-then-submit-before-autosave race) — mirror it locally.
      const key = kind === 'front' ? 'citizenIdImageFrontId' : 'citizenIdImageBackId';
      setField(key, out.file.id);
      setUploadState(kind, { busy: false, err: null });
    } catch (err) {
      setUploadState(kind, { preview: prevPreview, busy: false });
      if (!routeFatal(err)) {
        setUploadState(kind, {
          err: err.code === 'RATE_LIMITED' || err.code === 'TIMEOUT' || err.code === 'NETWORK'
            ? friendlyErrorText(err)
            : `อัปโหลดไม่สำเร็จ: ${err.message || 'ลองใหม่อีกครั้ง'}`,
        });
      }
    }
  };

  /* ---- Submit pipeline ---- */
  const validateBeforeSubmit = () => {
    if (!String(draft.address || '').trim()) return { msg: 'กรุณากรอกที่อยู่ปัจจุบัน', step: 1 };
    if (!String(draft.emergencyContactName || '').trim()
      || !String(draft.emergencyContactPhone || '').trim()) {
      return { msg: 'กรุณากรอกข้อมูลผู้ติดต่อฉุกเฉินให้ครบ', step: 1 };
    }
    if (!isValidThaiId(draft.citizenId)) return { msg: 'เลขบัตรประชาชนไม่ถูกต้อง — ตรวจอีกครั้ง', step: 2 };
    if (!draft.citizenIdImageFrontId || !draft.citizenIdImageBackId) {
      return { msg: 'กรุณาแนบภาพบัตรประชาชนทั้งหน้าและหลัง', step: 2 };
    }
    if (!agreed) return { msg: 'กรุณาติ๊กยอมรับข้อตกลงก่อนส่ง', step: 3 };
    if (!hasInk && !draft.signatureFileId) return { msg: 'กรุณาเซ็นชื่อในกรอบก่อนส่ง', step: 3 };
    return null;
  };

  const submit = async () => {
    if (busy) return;
    setFormError(null);
    const bad = validateBeforeSubmit();
    if (bad) {
      gotoStep(bad.step);
      setFormError(bad.msg);   // gotoStep clears formError — set after navigating
      return;
    }
    setBusy(true);
    try {
      // 1) Upload fresh ink (if any) — otherwise reuse the saved signature.
      let signatureFileId = draft.signatureFileId || null;
      if (hasInk && padRef.current) {
        const sigDataUrl = padRef.current.toDataURL();
        if (sigDataUrl) {
          const out = await api(`/api/contract-fill/${tokenFromUrl}/upload`, {
            method: 'POST', body: { kind: 'signature', dataUrl: sigDataUrl },
          });
          signatureFileId = out.file.id;
          setField('signatureFileId', signatureFileId);
        }
      }
      if (!signatureFileId) {
        setFormError('บันทึกลายเซ็นไม่สำเร็จ — เซ็นใหม่แล้วลองอีกครั้ง');
        return;
      }
      // 2) Submit with the final draft as a one-shot payload (the server
      //    merges it as a last save before flipping to submitted).
      const payload = { ...draftPayload(draft), signatureFileId };
      await api(`/api/contract-fill/${tokenFromUrl}/submit`, { method: 'POST', body: payload });
      setDraft((d) => ({ ...d, signatureFileId }));
      setSubmittedAt(new Date().toISOString());
      setPhase('waiting');
      scrollTop();
    } catch (err) {
      if (err.code === 'INCOMPLETE' && err.body && Array.isArray(err.body.missing)) {
        const infos = err.body.missing.map((k) => MISSING_FIELD_INFO[k]).filter(Boolean);
        const labels = infos.map((i) => i.label);
        const firstStep = infos.length ? Math.min(...infos.map((i) => i.step)) : 1;
        setStep(firstStep);
        scrollTop();
        setFormError(`ข้อมูลยังไม่ครบ — ขาด: ${labels.length ? labels.join(', ') : err.body.missing.join(', ')}`);
      } else if (err.code === 'INVALID_UPLOADS') {
        // Server says the attached files don't belong to this invitation —
        // wipe them and force re-upload from this page.
        setDraft((d) => ({
          ...d, citizenIdImageFrontId: null, citizenIdImageBackId: null, signatureFileId: null,
        }));
        setUploads({
          front: { preview: null, busy: false, err: null },
          back: { preview: null, busy: false, err: null },
        });
        if (padRef.current) padRef.current.clear();
        setStep(2);
        scrollTop();
        setFormError('ไฟล์แนบไม่ตรงกับลิงก์สัญญานี้ — กรุณาอัปโหลดรูปบัตรและเซ็นใหม่อีกครั้ง');
      } else if (!routeFatal(err)) {
        setFormError(friendlyErrorText(err));
      }
    } finally {
      setBusy(false);
    }
  };

  /* ---- Render ---- */
  const inFill = phase === 'welcome' || phase === 'fill';
  const showSaveChip = inFill && view && view.status === 'pending';

  let content = null;
  if (phase === 'loading') {
    content = <Card><div className="muted">กำลังโหลดข้อมูลสัญญา…</div></Card>;
  } else if (phase === 'dead') {
    content = <DeadLinkScreen kind={deadKind || 'invalid'} view={view} />;
  } else if (phase === 'success') {
    content = <SuccessScreen view={view} />;
  } else if (phase === 'waiting') {
    content = <WaitingScreen view={view} draft={draft} submittedAt={submittedAt} />;
  } else if (phase === 'welcome') {
    content = (
      <>
        {view.rejectionReason ? (
          <FixBanner reason={view.rejectionReason}
            onGoFix={() => { setPhase('fill'); gotoStep(guessFixStep(view.rejectionReason)); }} />
        ) : null}
        <WelcomeScreen view={view}
          onStart={() => { setPhase('fill'); setStep(1); scrollTop(); }} />
      </>
    );
  } else {
    content = (
      <>
        {view.rejectionReason ? (
          <FixBanner reason={view.rejectionReason}
            onGoFix={() => gotoStep(guessFixStep(view.rejectionReason))} />
        ) : null}
        {formError ? <Alert tone="danger">{formError}</Alert> : null}
        <Stepper step={step} />
        {step === 1 ? (
          <StepPersonal draft={draft} setField={setField}
            onBack={() => { setPhase('welcome'); scrollTop(); }}
            onNext={() => gotoStep(2)} />
        ) : null}
        {step === 2 ? (
          <StepIdentity draft={draft} setField={setField}
            uploads={uploads} onUpload={handleUpload}
            onBack={() => gotoStep(1)} onNext={() => gotoStep(3)} />
        ) : null}
        {step === 3 ? (
          <StepReviewSign view={view} draft={draft} setField={setField}
            uploads={uploads}
            onBack={() => gotoStep(2)} onSubmit={submit} busy={busy} gotoStep={gotoStep}
            padRef={padRef} hasInk={hasInk} setHasInk={setHasInk}
            agreed={agreed} setAgreed={setAgreed} />
        ) : null}
      </>
    );
  }

  return (
    <>
      <TopBar view={view} savedAt={savedAt} saving={saving} saveErr={saveErr}
        showSave={showSaveChip && phase === 'fill'} />
      <main className="shell">
        {content}
      </main>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
